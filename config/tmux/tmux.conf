# --- Configuración General ---
unbind C-b
set -g mouse on
set-option -g prefix M-Space
bind M-Space send-prefix

# Reload rápido
bind r source-file ~/.config/tmux/tmux.conf \; display-message "¡Se ajustó TMUX, compa!"

# Índices y teclado
set -g base-index 1
set -g pane-base-index 1
setw -g mode-keys vi
set -s escape-time 0
set -s extended-keys off
set -g focus-events on
set -g allow-passthrough on

# --- Terminal & Soporte de Color ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc:smulx=\E[4:3m:rmulx=\E[4:0m:sitm=\E[3m:ritm=\E[23m'

# --- Arreglo del Scroll (Copy Mode Fluido) ---
# Esto hace que el scroll entre a copy-mode solito y no se trabe
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# --- Navegación y Paneles ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Smart pane switching (Awareness of Neovim splits)
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Resize de paneles con Alt + h/j/k/l
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# --- Zoom & Movimiento ---
bind Up if -F '#{window_zoomed_flag}' 'select-pane -U ; resize-pane -Z'
bind Down if -F '#{window_zoomed_flag}' 'select-pane -D ; resize-pane -Z'
bind Left if -F '#{window_zoomed_flag}' 'select-pane -L ; resize-pane -Z'
bind Right if -F '#{window_zoomed_flag}' 'select-pane -R ; resize-pane -Z'

# --- Copy Mode tipo VIM ---
bind _ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi q send -X cancel

# Ventanas y Sesiones
bind h previous-window
bind l next-window
bind-key j switch-client -p
bind-key k switch-client -n
bind X kill-window
bind x kill-pane

# --- Estética (Status Bar) ---
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'
set -g status-position top
set -g status-interval 1
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

set -g status-left-length 100
set -g status-left "#[bg=default,fg=colour4]  #{pane_current_command} #[fg=colour15]│ #[fg=colour4] #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} #{?window_zoomed_flag,#[fg=colour7 bold] zoom ,}"

set -g status-right-length 100
set -g status-right " #{?client_prefix,#[fg=colour8 bold]PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=colour3 bold]COPY ,#[fg=colour4 bold]NORMAL }}#[fg=colour15]│ #[fg=colour15,bold] #S #[fg=colour15]│ #[fg=colour5,bold]󰍛 #(free -h | awk 'NR==2{printf \"%.0f%%\", $3*100/$2 }')"

set -g window-status-format " #I#{?#{!=},: #W,} "
set -g window-status-style "bg=default,fg=colour2"
set -g window-status-current-format " #I#{?#{!=},: #W,} "
set -g window-status-current-style "bg=default,fg=colour4,bold"
set -gF window-status-separator "#[bg=none,fg=colour15]│"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # <--- Agregado para estabilidad
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'yazi'

# Scratchpad (Ventana flotante)
bind-key o if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'
