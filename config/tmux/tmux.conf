unbind C-b
set -g mouse on
set-option -g prefix M-Space
bind M-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Se ajusto TMUX!"
set -g base-index 1
set -g pane-base-index 1
setw -g mode-keys vi
set -g allow-passthrough on

# Permitir secuencias de italic

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc:smulx=\E[4:3m:rmulx=\E[4:0m:sitm=\E[3m:ritm=\E[23m'

# set -g default-terminal "xterm-kitty"
# set -as terminal-overrides ',xterm-kitty:Ms=\E]52;c;%p2%s\7:Tc:smulx=\E[4:3m'

set -g focus-events on
set -g allow-passthrough on

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# TMUX
# bind-key -n C-t send-keys "fzf" C-m

# Swap paneles
# bind-key -n C-M-h if -F "#{@pane-is-vim}" 'send-keys C-M-h' 'swap-pane -t -1'
bind-key -n C-M-j if -F "#{@pane-is-vim}" 'send-keys C-M-j' 'swap-pane -D'
bind-key -n C-M-k if -F "#{@pane-is-vim}" 'send-keys C-M-k' 'swap-pane -U'
# bind-key -n C-M-l if -F "#{@pane-is-vim}" 'send-keys C-M-l' 'swap-pane -t 1'

# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

# Cambiar Ventanas cuando este en modo ZOOM

# Optional: Bind arrow keys to switch panes and keep zoom state
bind Up if -F '#{window_zoomed_flag}' 'select-pane -U ; resize-pane -Z'
bind Down if -F '#{window_zoomed_flag}' 'select-pane -D ; resize-pane -Z'
bind Left if -F '#{window_zoomed_flag}' 'select-pane -L ; resize-pane -Z'
bind Right if -F '#{window_zoomed_flag}' 'select-pane -R ; resize-pane -Z'

# Copy MODE tipo VIM
bind _ copy-mode

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi q send -X cancel

# Ventanas
bind h previous-window
bind l next-window

# Sesiones
bind-key j switch-client -p
bind-key k switch-client -n

# Cerrar la sesión actual con prefix + x
bind X kill-window
bind x kill-pane

# Borrar sesiones de resurrect
bind-key M-d command-prompt -p "Borrar archivos de resurrect? (y/n)" "run-shell 'if [ \"%%\" = \"y\" ]; then rm -f ~/.local/share/tmux/resurrect/* && tmux display-message \"Archivos de resurrect eliminados\"; else tmux display-message \"Cancelado\"; fi'"


# Border config
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'


# Status bar config
set -g status-position top
set -g status-interval 1
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=default,fg=colour4]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=colour15,none]│"
set -ga status-left "#[bg=default,fg=colour4]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=colour7,none]#{?window_zoomed_flag,❯,}"
set -ga status-left "#[bg=default,fg=colour7 bold]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right " #{?client_prefix,#[fg=colour8 bold]PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=colour3 bold]COPY ,#[fg=colour4 bold]NORMAL }}"
set -ga status-right "#[bg=none,fg=colour15,none]│"
set -ga status-right "#[bg=none,fg=colour15,bold]  #S "
set -ga status-right "#[bg=none,fg=colour15,none]│"
set -ga status-right " #[bg=none,fg=colour5,bold]󰍛 #(free -h | awk 'NR==2{printf \"%.0f%%\", $3*100/$2 }')"
set -ga status-right "#[bg=none,fg=colour15,none] │"
set -ga status-right " #[bg=none,fg=colour5,bold]#(acpi -b | awk '{ match($0, /([0-9]+)%/, a); p=a[1]; if(/Charging/){ if(p<=10)icon=\"󰢜\";else if(p<=20)icon=\"󰂆\";else if(p<=30)icon=\"󰂇\";else if(p<=40)icon=\"󰂈\";else if(p<=50)icon=\"󰢝\";else if(p<=60)icon=\"󰂉\";else if(p<=70)icon=\"󰢞\";else if(p<=80)icon=\"󰂊\";else if(p<=90)icon=\"󰂋\";else icon=\"󰂄\";}else{ if(p<=10)icon=\"󰁺\";else if(p<=20)icon=\"󰁻\";else if(p<=30)icon=\"󰁼\";else if(p<=40)icon=\"󰁽\";else if(p<=50)icon=\"󰁾\";else if(p<=60)icon=\"󰁿\";else if(p<=70)icon=\"󰂀\";else if(p<=80)icon=\"󰂁\";else if(p<=90)icon=\"󰂂\";else icon=\"󰁹\";} print icon \" \" p \"%\" }')"

set -g window-status-format " #I#{?#{!=},: #W,} "
set -g window-status-style "bg=default,fg=colour2"
# set -g window-status-last-style "bg=default,fg=colour9"
# set -g window-status-activity-style "bg=default,fg=colour5}"
set -g window-status-bell-style "bg=colour1,fg=colour5,bold"
set -gF window-status-separator "#[bg=none,fg=colour15]│"

set -g window-status-current-format " #I#{?#{!=},: #W,} "
set -g window-status-current-style "bg=default,fg=colour4,bold"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# set -g @sessionx-bind 'o'
set -g @resurrect-processes 'yazi'
set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'

# Floating window
bind-key o if-shell -F '#{==:#{session_name},scratch}' {
detach-client
} {
# open in the same directory of the current pane
display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

run '~/.tmux/plugins/tpm/tpm'
