include ~/.cache/wal/colors-kitty.conf
# include ~/.config/kitty/themes/matugen.conf

----- GENERAL -----
font_family family="Iosevka"
font_size 12.0
disable_ligatures active always
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

dynamic_background_opacity yes
hide_window_decorations yes
adjust_line_height 110%
config_reload_on_change yes
window_padding_width 15
window_margin_width 0
window_border_width 0
background_opacity 0.7
detect_urls yes
shell fish
confirm_os_window_close 0

mouse_hide_wait -1
----> KEYBIDNS <-----

clear_all_shortcuts yes
allow_remote_control yes


map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config

map ctrl+up    scroll_line_up
map ctrl+down  scroll_line_down

# Para el Aumentar o Disminuir el Font
# Teclas>
map ctrl+kp_add change_font_size all +2.0
map ctrl+kp_subtract change_font_size all -2.0
# Reset del font
map ctrl+backspace change_font_size all 0

map ctrl+shift+e open_url_with_hints

