# Submaps de Keybinds

# Grupo de Keybinds para ejecutar ciertos programas o scripts
submap = launch
bind = , Return, exec, $terminal
bind =  CONTROL ,Return, exec, $terminal --title=float-terminal & $resetSubMap
bind =  SHIFT ,Return, exec, $terminal -e tmux & $resetSubMap
bind = , v, exec, $terminal  --title=wiremix -e wiremix & $resetSubMap
bind = , n, exec, $terminal --title=impala -e impala & $resetSubMap
bind = , b, exec, $browser & $resetSubMap
bind =  SHIFT, B, exec, $browser --private-window & $resetSubMap
bind = , e, exec, $terminal -e yazi & $resetSubMap
# bind = SHIFT, E, exec, $terminal --title=YaziFloat -e 'yazi' & $resetSubMap
bind = , w, exec, $terminal --title=wallpaper-switcher -e sh -lc "cd Pictures/Wallpapers;yazi" & $resetSubMap
bind = , c, exec, $terminal --title=Nvim -e nvim & $resetSubMap
bind = , m, exec, $terminal -e btop & $resetSubMap
bind = , d, exec, $terminal --title=bluetui -e bluetui & $resetSubMap
bind = , l, exec, localsend_app & $resetSubMap
bind = SHIFT, C, exec, zeditor & $resetSubMap
bind = , Escape,exec, $resetSubMap
bind = CONTROL, C, exec, $resetSubMap
bind = , Q,exec, $resetSubMap
submap = reset

#Grupo de Keybinds para poder Reudicr el Tamaño de los Windows
submap = resize
bind = , H, resizeactive, -40 0
bind = , L, resizeactive, 40 0
bind = , K, resizeactive, 0 -40
bind = , J, resizeactive, 0 40
bind = , right, layoutmsg, colresize +0.2
bind = , left, layoutmsg, colresize -0.2
bind = , M, submap, move
bind = , Escape,exec, $resetSubMap
bind = CONTROL, C, exec, $resetSubMap
bind = , Q,exec, $resetSubMap
submap = reset

# Grupo de Keybinds para Mover los Windows
submap = move
bind = , H, moveactive, -40 0
bind = , L, moveactive, 40 0
bind = , K, moveactive, 0 -40
bind = , J, moveactive, 0 40
bind = , R, submap, resize
bind = , Escape,exec, $resetSubMap
bind = CONTROL, C, exec, $resetSubMap
bind = , Q,exec, $resetSubMap
submap = reset

# Grupo de Keybinds para realizar Zoom en la Pantalla
submap = zoom
bind = , mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = , mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
rinde = , equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')                                      
binde = , minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')       
binde = , KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')                                     
binde = , KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end') 

bind = , R, exec, hyprctl -q keyword cursor:zoom_factor 1 
bind = CONTROL, C, exec, hyprctl -q keyword cursor:zoom_factor 1  && $resetSubMap
bind = , Escape,exec, hyprctl -q keyword cursor:zoom_factor 1  && $resetSubMap 
bind = , Q,exec, hyprctl -q keyword cursor:zoom_factor 1  $resetSubMap
submap = reset

# Trigger de Submaps
bind = $mainMod, Z, submap, zoom
bind = $mainMod, Return, submap, launch
bind = $mainMod, R, submap, resize
bind = $mainMod, M, submap, move

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Switch layouts con Scripts
bind = $mainMod CONTROL, SPACE, exec, sh $pathScripts/switch_layout.sh
bind = $mainMod SHIFT, I, exec, sh $pathScripts/terminal_opacity.sh

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
