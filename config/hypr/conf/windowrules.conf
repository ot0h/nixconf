##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule = match:class ^(Alacritty|kitty|kitty-dropterm|com.mitchellh.ghostty)$, tag +terminal

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = windowrule-3
  float = on
  match:title = ^YaziSelector$
}

 windowrule {
   name = windowrule-4
   size = (monitor_w*0.8) (monitor_h*0.9)
   match:class = ^(kitty)$
   match:title = ^(YaziSelector)$
 }

windowrule {
  name = windowrule-7
  opacity = 0.85 0.85
  match:class = ^(Spotify)$
}


# Float windowrule
windowrule {
  name = windowrule-8
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:class = ^(org.pulseaudio.pavucontrol)
}

windowrule {
  name = windowrule-9
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:class = ^(blueman-manager)
}

windowrule {
  name = windowrule-10
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:class = ^(nm-connection-editor)
}

windowrule {
  name = windowrule-11
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:title = ^(clipse)
}

windowrule {
  name = windowrule-12
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:title = ^(YaziFloat)
}

windowrule {
  name = windowrule-13
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:class = ^(localsend)
}


# windowrule - ######### float popups and dialogue #######
windowrule {
  name = windowrule-14
  float = on
  match:title = ^(Authentication Required)$
  center = on
}


windowrule {
  name = windowrule-15
  float = on
  match:class = (codium|codium-url-handler|VSCodium)
  match:title = negative:(.*codium.*|.*VSCodium.*)
}

windowrule {
  name = windowrule-16
  float = on
  match:class = ^(com.heroicgameslauncher.hgl)$
  match:title = negative:(Heroic Games Launcher)
}

windowrule {
  name = windowrule-17
  float = on
  match:class = ^([Ss]team)$
  match:title = negative:^([Ss]team)$
}

windowrule {
  name = windowrule-18
  float = on
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar.*)
}


windowrule {
  name = windowrule-19
  float = on
  match:title = ^(Add Folder to Workspace)$
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
}




windowrule {
  name = windowrule-20
  float = on
  match:title = ^(Save As)$
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
}


windowrule {
  name = windowrule-21
  float = on
  match:initial_title = (Open Files)
  size = (monitor_w*0.7) (monitor_h*0.6)
}


# Netbeans
windowrule {
  name = windowrule-22
  center = on
  match:class = ^Apache NetBeans IDE.*$
  float = on
  no_initial_focus = on
}

windowrule {
  name = windowrule-23
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:title = ^(wiremix)
}

windowrule {
  name = impala
  match:title = ^(impala)
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
}

windowrule {
  name = bluetui
  match:title = ^(bluetui)
  float = on
  center = on
  size = (monitor_w*0.5) (monitor_h*0.5)
}

windowrule {
  name = wallpaper
  float = on
  center = on
  size = (monitor_w*0.4) (monitor_h*0.4)
  match:title = ^(wallpaper-switcher)
}

windowrule {
  name = termfilechooser
  float = on
  match:title = ^(termfilechooser)$
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
  opacity = 1.0
}


windowrule {
  name = Jetbrains
  float = on
  match:class = ^(jetbrains-studio)$
  center = on
}

windowrule {
  name = AndroidStudio
  float = off
  match:title = ^(.*Android Studio.*)$
}


windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true

}

windowrule {
  name = float-terminal
  match:title = ^(float-terminal)
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)

}

windowrule {
  name = graphito
  match:title = ^(graphito)
  float = on
  center = on
}
